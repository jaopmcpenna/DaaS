# Configuração do Estudo de Viabilidade Drone-as-a-Service
# Este arquivo contém os parâmetros principais do estudo

study_metadata:
  name: "Drone-as-a-Service Feasibility Study"
  version: "0.1.0"
  description: "Análise de viabilidade técnica e econômica de serviços de entrega por drones"

# Parâmetros dos Drones
drone_parameters:
  # Capacidades físicas
  max_payload_kg: 2.5
  max_range_km: 15.0
  cruise_speed_kmh: 45.0
  battery_capacity_wh: 22000
  
  # Parâmetros operacionais
  takeoff_landing_time_min: 2.0
  charging_time_min: 45.0
  maintenance_interval_flights: 100
  
  # Custos (em USD)
  acquisition_cost: 15000
  maintenance_cost_per_flight: 2.5
  insurance_cost_annual: 1200

# Parâmetros das Rotas e Logística
logistics_parameters:
  # Áreas de operação
  service_radius_km: 10.0
  hub_locations: []  # será preenchido com coordenadas específicas
  
  # Restrições operacionais
  max_wind_speed_kmh: 25.0
  min_visibility_km: 3.0
  operating_hours:
    start: "08:00"
    end: "18:00"
  
  # Parâmetros de demanda
  avg_orders_per_day: 150
  peak_hours: ["12:00-14:00", "18:00-20:00"]

# Parâmetros Econômicos
economic_parameters:
  # Custos operacionais
  pilot_cost_per_hour: 25.0
  energy_cost_per_kwh: 0.15
  facility_rental_monthly: 5000.0
  
  # Parâmetros financeiros
  discount_rate: 0.08
  study_period_years: 5
  inflation_rate: 0.03
  
  # Pricing
  base_delivery_fee: 8.0
  per_km_fee: 1.5
  express_surcharge: 3.0

# Configurações de Simulação
simulation_parameters:
  # Monte Carlo
  n_simulations: 1000
  random_seed: 42
  
  # Cenários de análise
  scenarios:
    conservative:
      demand_multiplier: 0.7
      cost_multiplier: 1.2
    base_case:
      demand_multiplier: 1.0
      cost_multiplier: 1.0
    optimistic:
      demand_multiplier: 1.5
      cost_multiplier: 0.8

# Configurações de Dados
data_config:
  # Caminhos relativos ao diretório raiz
  input_data_path: "data/raw/"
  processed_data_path: "data/processed/"
  output_path: "data/results/"
  
  # Formatos de arquivo
  preferred_format: "parquet"
  backup_format: "csv"

# Configurações de Análise de Risco
risk_parameters:
  # Fatores de risco identificados
  weather_risk_weight: 0.3
  regulatory_risk_weight: 0.2
  technical_risk_weight: 0.25
  market_risk_weight: 0.25
  
  # Distribuições de probabilidade para Monte Carlo
  weather_disruption_days_per_year:
    distribution: "poisson"
    lambda: 15
  
  regulatory_delay_months:
    distribution: "uniform"
    min: 0
    max: 12
